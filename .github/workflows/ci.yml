name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
   
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: naengtori
          POSTGRES_USER: naengtori
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naengtori -d naengtori"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: test-password
      KAKAO_CLIENT_ID: test-kakao-client-id
      KAKAO_CLIENT_SECRET: test-kakao-client-secret
      NAVER_CLIENT_ID: test-naver-client-id
      NAVER_CLIENT_SECRET: test-naver-client-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
      - name: Build executable JAR
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
      - name: Verify JAR
        working-directory: backend
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)
          test -n "$JAR_FILE"
          ls -lh "$JAR_FILE"
